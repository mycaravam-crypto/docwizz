apiVersion: apps/v1
kind: Deployment
metadata:
  name: materials-api
spec:
  template:
    spec:
      containers:
        - name: api
          image: registry.example.com/materials-api:1.4
          ports: [{ containerPort: 8080 }]
          env:
            - name: Warehouse__BaseUrl
              value: https://warehouse.internal/
---
apiVersion: v1
kind: Service
metadata:
  name: materials-api
spec:
  ports: [{ port: 80, targetPort: 8080 }]
