# Original illustrative template for docwizz (schema 1), not an official V-Modell XT template.
# Structured after the V-Modell XT Bund product reference and arc42 examples.
# Decide tailoring, product version and content approval for your project.
# NOTE: these comments are filling hints and do NOT appear in the generated product.
# docwizz fills only the ids "structure" and "interfaces" from code.
schema: 1
product_id: sw-specification
xt_variant: V-Modell XT
xt_version: "2.4"
tailoring: project-specific
sections:
  # Goal/evidence: software element id, level (unit, component, module), product baseline and revision history.
  - id: document-control
    title: Document control and version baseline
    required: true
    sources: [project]
  # Goal/evidence: purpose, role in the system, owner and business boundaries of the software element.
  - id: element-overview
    title: Software element overview and responsibility
    required: true
    sources: [project]
  # Goal/evidence: originating system, parent specification and excluded behaviour.
  - id: scope
    title: Scope, assumptions and context
    required: true
    sources: [project]
  # Goal/evidence: requirement ids, parent requirement, priority, source, assumption and allocation rule.
  - id: derived-requirements
    title: Derived and allocated requirements
    required: true
    sources: [project]
  # Goal/evidence: atomic, testable SHALL/MUST statements, pre- and postconditions, variants and domain rules.
  - id: functional-requirements
    title: Functional requirements and business rules
    required: true
    sources: [project]
  # Goal/evidence: automatically only dependency edges, no contract; add operations, schemas, protocols, version and permissions.
  - id: interfaces
    title: Interface description – static contract
    required: true
    sources: [code, project]
  # Goal/evidence: flow and state transitions, concurrency, timeouts, retries and negative cases.
  - id: behaviour
    title: Dynamic behaviour and state model
    required: true
    sources: [project]
  # Goal/evidence: data types, units, limits, required fields, identifiers, data quality and lifetime.
  - id: data-contracts
    title: Data structures, invariants and validation
    required: true
    sources: [project]
  # Goal/evidence: measurable goals for reliability, performance, maintainability, interaction capability, security, compatibility and safety where relevant.
  - id: nonfunctional-requirements
    title: Quality requirements per ISO/IEC 25010
    required: true
    sources: [project]
  # Goal/evidence: CIA protection goals, roles and permissions, accountability, data minimization, threats and verifiable criteria.
  - id: security-privacy
    title: Security, privacy and protection requirements
    required: true
    sources: [project]
  # Goal/evidence: refinement of interface functions onto subordinate software elements; not to be confused with the architecture diagram.
  - id: interface-realization
    title: Interface realization and allocation
    required: true
    sources: [project]
  # Goal/evidence: budgets and quality goals distributed to components, including combination and measurement rules.
  - id: quality-refinement
    title: Refinement of non-functional requirements
    required: true
    sources: [project]
  # Goal/evidence: error codes, compensation, rollback, resilience rules, rate limits and user communication.
  - id: error-semantics
    title: Error cases, exception and recovery behaviour
    required: true
    sources: [project]
  # Goal/evidence: testable criteria per requirement with test level, measurement method, tolerances and target value.
  - id: acceptance-criteria
    title: Verification and acceptance criteria
    required: true
    sources: [project]
  # Goal/evidence: requirements up and down, software element/architecture and test ids; docwizz trace shows declared gaps.
  - id: traceability
    title: Bidirectional requirement traceability
    required: true
    sources: [project]
  # Goal/evidence: approved platforms, IT security concept, life cycle, technology constraints and operating restrictions.
  - id: constraints
    title: Standards, regulatory and technical constraints
    required: true
    sources: [project]
  # Goal/evidence: consistent domain terms, document references and external standards with versions.
  - id: glossary
    title: Glossary and references
    required: false
    sources: [project]
dependencies: []
