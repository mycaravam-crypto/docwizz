# Original illustrative template for docwizz (schema 1), not an official V-Modell XT template.
# Structured after the V-Modell XT Bund product reference and arc42 examples.
# Decide tailoring, product version and content approval for your project.
# NOTE: these comments are filling hints and do NOT appear in the generated product.
# docwizz fills only the ids "structure" and "interfaces" from code.
schema: 1
product_id: system-element-test-specification
xt_variant: V-Modell XT
xt_version: "2.4"
tailoring: project-specific
sections:
  # Goal/evidence: test specification version, responsible tester, baseline, changes and review references.
  - id: document-control
    title: Document control and test baseline
    required: true
    sources: [project]
  # Goal/evidence: element id, release/commit, build and interfaces under test; external dependencies relevant to testing.
  - id: test-object
    title: Test object and unique configuration
    required: true
    sources: [project]
  # Goal/evidence: approved software specification, test concept, requirement versions, scope and exclusions.
  - id: test-basis
    title: Test basis, requirements and scope
    required: true
    sources: [project]
  # Goal/evidence: risk and requirement links, black/white box, functional, security, performance and reliability tests.
  - id: test-strategy
    title: Test strategy, test levels and methods
    required: true
    sources: [project]
  # Goal/evidence: severity and likelihood of harm, prioritization and the reasons for omitted tests.
  - id: risk-priorities
    title: Test priorities and risk-based selection
    required: true
    sources: [project]
  # Goal/evidence: test-case id, requirement id, start state, input data, actions, expected end state, oracle and a negative example.
  - id: test-cases
    title: Test cases with steps and expected results
    required: true
    sources: [project]
  # Goal/evidence: data sets, anonymization, boundary values, seed, deletion concept and deterministic repeatability.
  - id: test-data
    title: Test data, test accounts and data clean-up
    required: true
    sources: [project]
  # Goal/evidence: hardware, OS and containers, services, versions, network, access roles, tools and external test doubles.
  - id: test-environment
    title: Test environment, prerequisites and configuration
    required: true
    sources: [project]
  # Goal/evidence: pass/fail per test case, stop criteria, defect severities and release thresholds, decided in advance.
  - id: acceptance
    title: Entry, exit and evaluation criteria
    required: true
    sources: [project]
  # Goal/evidence: explicit requirement -> test case; risk weighting, optional branch or code coverage, and missing evidence.
  - id: coverage
    title: Test-case allocation and coverage matrix
    required: true
    sources: [project]
  # Goal/evidence: test data protection, credential handling, isolation, CIA evidence and safeguards for destructive tests.
  - id: security-privacy
    title: Safeguards and information security
    required: true
    sources: [project]
  # Goal/evidence: defect triage, severity, retest, regression, evidence link; the test log is a separate result product.
  - id: defect-handling
    title: Deviations, defect handling and retesting
    required: true
    sources: [project]
  # Goal/evidence: test runner, pipeline, versioning, marking of flaky tests, artifact retention and test procedure.
  - id: automation
    title: Automation and reproducibility
    required: true
    sources: [project]
  # Goal/evidence: completeness, consistency, review roles and evidence of open risks; no automatic approval.
  - id: review-criteria
    title: Testability and QA review of the specification
    required: true
    sources: [project]
  # Goal/evidence: binding specifications, execution instructions and test guidelines.
  - id: references
    title: Glossary and references
    required: false
    sources: [project]
dependencies: [sw-specification]
