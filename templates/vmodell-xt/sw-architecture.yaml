# Original illustrative template for docwizz (schema 1), not an official V-Modell XT template.
# Structured after the V-Modell XT Bund product reference and arc42 examples.
# Decide tailoring, product version and content approval for your project.
# NOTE: these comments are filling hints and do NOT appear in the generated product.
# docwizz fills only the ids "structure" and "interfaces" from code.
schema: 1
product_id: sw-architecture
xt_variant: V-Modell XT
xt_version: "2.4"
tailoring: project-specific
sections:
  # Goal/evidence: identity of the software unit, version and baseline, author, reviewers and change history; approval evidenced externally.
  - id: document-control
    title: Document control and configuration state
    required: true
    sources: [project]
  # Goal/evidence: system boundary, stakeholders, upstream and neighbouring systems, assumptions and exclusions.
  - id: scope
    title: Scope, system context and boundaries
    required: true
    sources: [project]
  # Goal/evidence: requirement ids, prioritized quality scenarios and verifiable constraints; ISO/IEC 25010.
  - id: architecture-drivers
    title: Architecture drivers and quality goals
    required: true
    sources: [project]
  # Goal/evidence: guiding principles and at least two seriously evaluated alternatives with criteria and trade-offs.
  - id: principles-alternatives
    title: Architecture principles and design alternatives
    required: true
    sources: [project]
  # Goal/evidence: ADR ids, decision status from a human process, context, options, consequences and risks.
  - id: decisions
    title: Architecture decisions and rationale
    required: true
    sources: [project]
  # Goal/evidence: automatic: a selection of detected top-level code elements (at most 40); human: responsibilities, boundaries, layers and comparison with the target architecture.
  - id: structure
    title: Decomposition of the software unit and building blocks
    required: true
    sources: [code, project]
  # Goal/evidence: software units, components, modules; which get their own specification, and why the others don't.
  - id: elements-to-specify
    title: Software elements to specify
    required: true
    sources: [project]
  # Goal/evidence: automatic: detected code dependencies (at most 40), no complete API contracts; human: protocol, roles, versioning and error cases.
  - id: interfaces
    title: Interfaces and dependencies
    required: true
    sources: [code, project]
  # Goal/evidence: at least the normal flow, cancellation, retry/timeout, a concurrency case and an error scenario, with a sequence diagram source.
  - id: runtime-scenarios
    title: Runtime and interaction scenarios
    required: true
    sources: [project]
  # Goal/evidence: input and output schemas, types, value ranges, ownership, classification and data life cycle.
  - id: data-catalog
    title: Data catalog and data flows
    required: true
    sources: [project]
  # Goal/evidence: error handling, transactions, versioning, logging, monitoring, consistency and configuration.
  - id: crosscutting-concepts
    title: Crosscutting concepts
    required: true
    sources: [project]
  # Goal/evidence: threats and security requirements with CIA goals, authentication and authorization, secret management, evidence references; ISO 27001 alone is no product certificate.
  - id: security-evidence
    title: Information security and data protection
    required: true
    sources: [project]
  # Goal/evidence: runtime nodes, deployment, scaling, backup, restore, RPO/RTO, observability and resources.
  - id: deployment-operations
    title: Deployment, operations and recovery
    required: true
    sources: [project]
  # Goal/evidence: scenario-based architecture evaluation, prototypes, quality evidence, open findings, remedies.
  - id: design-assurance
    title: Design assurance and architecture review
    required: true
    sources: [project]
  # Goal/evidence: bidirectional mapping requirement -> building block/ADR -> test evidence; also use docwizz trace.
  - id: traceability
    title: Requirement and architecture traceability
    required: true
    sources: [project]
  # Goal/evidence: risk owner, likelihood and impact, mitigations, review date and technical debt.
  - id: risks-debt
    title: Architecture risks and technical debt
    required: false
    sources: [project]
  # Goal/evidence: documented sources, versioned interface contracts, glossary and naming conventions.
  - id: references
    title: References and terms
    required: false
    sources: [project]
dependencies: []
