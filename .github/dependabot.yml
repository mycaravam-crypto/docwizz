# Weekly update PRs for this repository's dependencies, so fixes for the CVEs security.yml reports arrive as PRs instead
# of waiting for someone to bump them. Minor and patch bumps are grouped into one PR per ecosystem; majors come one by
# one. The cooldown waits a few days after a release before proposing it, so a hijacked or broken release is likely
# pulled before it reaches a PR. Security updates (from Dependabot alerts) skip the cooldown and the schedule.
version: 2
updates:
  # Only DocWizz's own projects: fixture and fixture-legacy are sample repositories its tests scan.
  - package-ecosystem: nuget
    directories: [/src/DocWizz, /tests/DocWizz.Tests]
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    groups:
      nuget: { patterns: ['*'], update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /scanner-vue
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    groups:
      npm: { patterns: ['*'], update-types: [minor, patch] }
    ignore:
      # TypeScript 7 drops the JavaScript compiler API (ts.SyntaxKind, ts.createSourceFile) that index.mjs parses with;
      # moving to it means rewriting the scanner, not bumping a version.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  # Actions are pinned by commit SHA; Dependabot bumps the SHA and its version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    groups:
      actions: { patterns: ['*'] }
