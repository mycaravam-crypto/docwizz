# Benchmarks (bench/run.py): on demand and weekly, never on pull requests. Fails only on a major regression (> 2x the
# committed baseline's time or memory); the table lands in the job summary either way.
name: bench
on:
  workflow_dispatch:
    inputs:
      sizes: { description: 'Sizes to run (small, medium, large)', default: 'small,medium,large' }
  schedule:
    - cron: '17 3 * * 1'   # Mondays 03:17 UTC
permissions:
  contents: read
jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: { dotnet-version: 10.0.x }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: npm, cache-dependency-path: scanner-vue/package-lock.json }
      - name: Benchmark against bench/baseline.json
        shell: bash
        env:
          SIZES: ${{ inputs.sizes || 'small,medium,large' }}
        run: python3 bench/run.py --sizes "$SIZES" --out "$RUNNER_TEMP/bench.json" --compare bench/baseline.json | tee "$RUNNER_TEMP/bench.md"
      - name: Summary
        if: always()
        shell: bash
        run: |
          { echo "### DocWizz benchmarks"; echo; cat "$RUNNER_TEMP/bench.md" 2>/dev/null; echo; echo '```json'; cat "$RUNNER_TEMP/bench.json" 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
