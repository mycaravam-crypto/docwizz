# Static analysis (CodeQL) of this repository's own code: C#, the JavaScript scanners in scanner-vue, and the GitHub
# Actions workflows. Runs the security-and-quality suite, so alerts cover both vulnerabilities (injection, path
# traversal, unsafe deserialization) and code defects; results land in the Security tab and on the pull request.
# Complements security.yml, which covers known CVEs in dependencies. The weekly run re-scans main, since CodeQL's
# queries improve without any code change.
name: codeql
on:
  pull_request:
  push: { branches: [main] }
  schedule:
    - cron: '41 6 * * 1'   # Mondays 06:41 UTC
  workflow_dispatch:
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions: {}
jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: csharp, build-mode: manual }
          - { language: javascript-typescript, build-mode: none }
          - { language: actions, build-mode: none }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - if: matrix.build-mode == 'manual'
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with: { dotnet-version: 10.0.x }
      - uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
          # Sample repositories docwizz scans in its tests, not its own code (as in security.yml).
          config: |
            paths-ignore: [fixture, fixture-legacy]
      # C# is analysed from a real build, so the extractor sees resolved types and generated code.
      - if: matrix.build-mode == 'manual'
        run: dotnet build tests/DocWizz.Tests --nologo
      - uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          category: /language:${{ matrix.language }}
