# DocWizz's own tests, one step per layer so a red check names the layer that broke:
# unit (rules, analysis and CLI parsing, in-memory) → component (scanner → code model) → journey (the CLI as a process:
# setup on small repositories, errors, safe defaults) → end-to-end (test.sh on the fixtures).
name: test
on:
  pull_request:
  push: { branches: [main] }
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: { dotnet-version: 10.0.x }
      - name: ADO sync contract smoke tests
        run: bash scripts/test-sync-ado-evidence.sh
      - name: Release version rule
        run: |
          bash .github/scripts/next-version.test.sh
          bash .github/scripts/semver-next.test.sh
      # Component tests parse Java with scanner-vue/java.mjs (tree-sitter), so they need it installed too.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm, cache-dependency-path: scanner-vue/package-lock.json }
      - run: npm ci --prefix scanner-vue --silent
      - run: dotnet build tests/DocWizz.Tests --nologo -v q
      - name: Unit tests
        run: dotnet test --project tests/DocWizz.Tests --no-build --filter-namespace DocWizz.Tests.Unit
      - name: Component tests
        run: dotnet test --project tests/DocWizz.Tests --no-build --filter-namespace DocWizz.Tests.Component
  # Journey and end-to-end each take about a minute and need nothing from each other: separate jobs run them at once.
  journey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: { dotnet-version: 10.0.x }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm, cache-dependency-path: scanner-vue/package-lock.json }
      - run: npm ci --prefix scanner-vue --silent
      - name: Journey tests
        run: dotnet test --project tests/DocWizz.Tests --filter-namespace DocWizz.Tests.Journey
  end-to-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: { dotnet-version: 10.0.x }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm, cache-dependency-path: scanner-vue/package-lock.json }
      - run: npm ci --prefix scanner-vue --silent
      - name: End-to-end tests
        run: ./test.sh

  # Reproducible measurement; not a fragile wall-clock gate. Publish medians on every PR.
  # Synthetic RSA approvals, actual DOCX/PDF conversion and fail-closed negative tests.
  document-publication:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: { dotnet-version: 10.0.x }
      - name: Install document renderers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pandoc libreoffice-writer poppler-utils openssl
      - name: Build publication CLI
        run: dotnet build src/DocWizz/DocWizz.csproj -c Release --nologo -v q
      - name: Positive and negative publication journeys
        run: bash scripts/test-document-publication.sh "$PWD/src/DocWizz/bin/Release/net10.0/DocWizz.dll"

  performance-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: { dotnet-version: 10.0.x }
      - name: Mixed-project scoped vs full scan baseline
        run: |
          PROJECTS=24 SOURCES_PER_PROJECT=8 RUNS=2 bash scripts/benchmark-multi-project.sh | tee benchmark.txt
          {
            echo "### Multi-project scan baseline"
            echo "Build and first warm-up run excluded. Reported values are wall-clock samples, not a CI threshold."
            echo '~~~text'
            cat benchmark.txt
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
